<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Imfundo Quest architecture: three surfaces connected by a shared state core">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="a-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#131C2E"/>
    </linearGradient>
    <linearGradient id="a-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="a-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="a-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="a-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="a-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="0" fill="url(#a-bg)"/>
  <rect x="0" y="0" width="960" height="1" fill="#334155"/>

  <!-- ambient halo -->
  <ellipse cx="480" cy="230" rx="330" ry="150" fill="#6366F1" opacity="0.08" filter="url(#a-glow)"/>

  <!-- Title block -->
  <text x="48" y="52" fill="#F1F5F9" font-size="20" font-weight="600">Imfundo Quest — system architecture</text>
  <text x="48" y="74" fill="#94A3B8" font-size="13">One React SPA · three routed surfaces · one shared state core</text>

  <!-- Surface: Landing -->
  <g>
    <rect x="60" y="120" width="240" height="120" rx="14" fill="url(#a-card)" stroke="#334155"/>
    <rect x="60" y="120" width="240" height="120" rx="14" fill="url(#a-gloss)" opacity="0.08"/>
    <rect x="84" y="144" width="34" height="34" rx="9" fill="url(#a-indigo)"/>
    <text x="94" y="167" fill="#ffffff" font-size="15" font-weight="700">L</text>
    <text x="130" y="160" fill="#F1F5F9" font-size="16" font-weight="600">Marketing surface</text>
    <text x="130" y="178" fill="#94A3B8" font-size="12">Hero, problem, platform,</text>
    <text x="130" y="192" fill="#94A3B8" font-size="12">founder CTA, partner modal</text>
    <rect x="84" y="206" width="190" height="18" rx="9" fill="#0F172A" stroke="#334155"/>
    <text x="94" y="219" fill="#A5B4FC" font-size="11" font-family="ui-monospace, monospace">layout/Layout.tsx</text>
  </g>

  <!-- Surface: Auth -->
  <g>
    <rect x="60" y="272" width="240" height="104" rx="14" fill="url(#a-card)" stroke="#334155"/>
    <rect x="84" y="296" width="34" height="34" rx="9" fill="url(#a-indigo)" opacity="0.85"/>
    <text x="92" y="319" fill="#ffffff" font-size="15" font-weight="700">A</text>
    <text x="130" y="310" fill="#F1F5F9" font-size="16" font-weight="600">Auth surface</text>
    <text x="130" y="328" fill="#94A3B8" font-size="12">Login, signup, password</text>
    <text x="130" y="342" fill="#94A3B8" font-size="12">reset flows</text>
    <rect x="84" y="352" width="190" height="18" rx="9" fill="#0F172A" stroke="#334155"/>
    <text x="94" y="365" fill="#A5B4FC" font-size="11" font-family="ui-monospace, monospace">components/auth</text>
  </g>

  <!-- Surface: Learner app -->
  <g>
    <rect x="360" y="120" width="240" height="150" rx="14" fill="url(#a-card)" stroke="#6366F1" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="360" y="120" width="240" height="150" rx="14" fill="url(#a-gloss)" opacity="0.08"/>
    <rect x="384" y="144" width="34" height="34" rx="9" fill="url(#a-indigo)"/>
    <text x="393" y="167" fill="#ffffff" font-size="15" font-weight="700">A</text>
    <text x="430" y="158" fill="#F1F5F9" font-size="16" font-weight="600">Learner application</text>
    <text x="430" y="176" fill="#94A3B8" font-size="12">Dashboard, lesson player,</text>
    <text x="430" y="190" fill="#94A3B8" font-size="12">profile, offline controls</text>
    <text x="430" y="212" fill="#94A3B8" font-size="12" font-weight="500" fill-opacity="0.85">Gamified: XP, streaks,</text>
    <text x="430" y="226" fill="#94A3B8" font-size="12" font-weight="500" fill-opacity="0.85">combos, level progress</text>
    <rect x="384" y="242" width="192" height="18" rx="9" fill="#0F172A" stroke="#334155"/>
    <text x="394" y="255" fill="#A5B4FC" font-size="11" font-family="ui-monospace, monospace">shell/AppShell.tsx</text>
  </g>

  <!-- Surface: Teacher corner -->
  <g>
    <rect x="660" y="120" width="240" height="150" rx="14" fill="url(#a-card)" stroke="url(#a-emerald)" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="684" y="144" width="34" height="34" rx="9" fill="url(#a-emerald)"/>
    <text x="694" y="167" fill="#ffffff" font-size="15" font-weight="700">T</text>
    <text x="730" y="158" fill="#F1F5F9" font-size="16" font-weight="600">Teacher Corner</text>
    <text x="730" y="176" fill="#94A3B8" font-size="12">Analytics, cohort view,</text>
    <text x="730" y="190" fill="#94A3B8" font-size="12">synced progress, resources</text>
    <text x="730" y="212" fill="#94A3B8" font-size="12" font-weight="500" fill-opacity="0.85">Read-only view of learner</text>
    <text x="730" y="226" fill="#94A3B8" font-size="12" font-weight="500" fill-opacity="0.85">stats queued for sync</text>
    <rect x="684" y="242" width="192" height="18" rx="9" fill="#0F172A" stroke="#334155"/>
    <text x="694" y="255" fill="#86EFAC" font-size="11" font-family="ui-monospace, monospace">pages/TeacherCorner</text>
  </g>

  <!-- State core -->
  <g>
    <ellipse cx="480" cy="360" rx="150" ry="16" fill="#6366F1" opacity="0.15" filter="url(#a-glow)"/>
    <rect x="330" y="318" width="300" height="46" rx="12" fill="url(#a-indigo)"/>
    <rect x="330" y="318" width="300" height="46" rx="12" fill="url(#a-gloss)" opacity="0.25"/>
    <text x="480" y="337" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Contexts: App · Theme · Language</text>
    <text x="480" y="355" text-anchor="middle" fill="#E0E7FF" font-size="11">online toggle · sync queue · lesson stats · modal · chat</text>
    <line x1="480" y1="318" x2="480" y2="282" stroke="#64748B" stroke-width="1.5" marker-end="url(#a-arrow)"/>
  </g>

  <!-- Connectors -->
  <line x1="300" y1="180" x2="452" y2="180" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#a-arrow)"/>
  <line x1="300" y1="312" x2="322" y2="312" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#a-arrow)"/>
  <line x1="600" y1="312" x2="652" y2="240" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#a-arrow)"/>

  <!-- legend -->
  <g>
    <circle cx="700" cy="342" r="5" fill="#818CF8"/>
    <text x="712" y="346" fill="#94A3B8" font-size="11">React Router surface</text>
    <circle cx="700" cy="362" r="5" fill="#34D399"/>
    <text x="712" y="366" fill="#94A3B8" font-size="11">state consumption</text>
    <text x="60" y="398" fill="#475569" font-size="11" font-family="ui-monospace, monospace">src/App.tsx routes: / · /login · /signup · /dashboard · /lesson · /teachers · /profile</text>
  </g>
</svg>
