<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Inter, system-ui, sans-serif" role="img" aria-label="The learner loop: micro-lesson, quiz, XP and combos, levels and streaks, daily activity, synced to teacher corner">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="c-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#131C2E"/>
    </linearGradient>
    <linearGradient id="c-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="c-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="c-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="c-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <marker id="c-arrowi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818CF8"/>
    </marker>
    <marker id="c-arrowe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
    </marker>
    <marker id="c-arrowa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="url(#c-bg)"/>
  <text x="48" y="50" fill="#F1F5F9" font-size="20" font-weight="600">The learner loop</text>
  <text x="48" y="72" fill="#94A3B8" font-size="13">Five-question sessions, gamified reward state, and analytics rendered back to teachers</text>

  <!-- node 1: micro lesson -->
  <g>
    <ellipse cx="200" cy="180" rx="52" ry="46" fill="#6366F1" opacity="0.12" filter="url(#c-glow)"/>
    <rect x="130" y="140" width="140" height="80" rx="14" fill="url(#c-card)" stroke="#6366F1" stroke-opacity="0.5"/>
    <rect x="130" y="140" width="140" height="80" rx="14" fill="url(#c-gloss)" opacity="0.08"/>
    <text x="200" y="168" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="600">Micro-lesson</text>
    <text x="200" y="188" text-anchor="middle" fill="#94A3B8" font-size="11">bilingual, 3–5 min,</text>
    <text x="200" y="202" text-anchor="middle" fill="#94A3B8" font-size="11">pre-downloaded pack</text>
    <text x="200" y="252" text-anchor="middle" fill="#A5B4FC" font-size="10" font-family="ui-monospace, monospace">pages/LessonPlayer</text>
  </g>

  <!-- node 2: quiz -->
  <g>
    <ellipse cx="480" cy="180" rx="52" ry="46" fill="#10B981" opacity="0.12" filter="url(#c-glow)"/>
    <rect x="410" y="140" width="140" height="80" rx="14" fill="url(#c-card)" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="480" y="168" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="600">Quiz</text>
    <text x="480" y="188" text-anchor="middle" fill="#94A3B8" font-size="11">multiple choice,</text>
    <text x="480" y="202" text-anchor="middle" fill="#94A3B8" font-size="11">auto hints optional</text>
    <text x="480" y="252" text-anchor="middle" fill="#6EE7B7" font-size="10" font-family="ui-monospace, monospace">hooks/useQuiz.ts</text>
  </g>

  <!-- node 3: rewards -->
  <g>
    <ellipse cx="760" cy="180" rx="52" ry="46" fill="#F59E0B" opacity="0.12" filter="url(#c-glow)"/>
    <rect x="690" y="140" width="140" height="80" rx="14" fill="url(#c-card)" stroke="#F59E0B" stroke-opacity="0.5"/>
    <text x="760" y="168" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="600">Rewards</text>
    <text x="760" y="188" text-anchor="middle" fill="#94A3B8" font-size="11">XP, combo multipliers,</text>
    <text x="760" y="202" text-anchor="middle" fill="#94A3B8" font-size="11">level + streak carry</text>
    <text x="760" y="252" text-anchor="middle" fill="#FCD34D" font-size="10" font-family="ui-monospace, monospace">contexts/AppContext</text>
  </g>

  <!-- arc arrows -->
  <path d="M276 168 Q 342 140 404 160" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#c-arrowi)"/>
  <path d="M556 168 Q 622 140 684 160" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#c-arrowe)"/>

  <!-- return arc -->
  <path d="M760 226 Q 760 330 480 336 Q 200 330 200 226" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 7" marker-end="url(#c-arrowa)"/>
  <g>
    <rect x="376" y="300" width="208" height="30" rx="9" fill="url(#c-card)" stroke="#F59E0B" stroke-opacity="0.55"/>
    <text x="480" y="320" text-anchor="middle" fill="#FCD34D" font-size="12" font-weight="600">level cleared — next lesson unlocks</text>
  </g>

  <!-- teacher corner snapshot -->
  <g>
    <rect x="60" y="292" width="270" height="60" rx="12" fill="url(#c-card)" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="82" y="316" fill="#86EFAC" font-size="12" font-weight="600">Teacher Corner</text>
    <text x="82" y="334" fill="#94A3B8" font-size="11">sees XP, streaks and queue as cohorts</text>
    <path d="M330 322 Q 352 322 368 318" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#c-arrowe)"/>
  </g>

  <g>
    <rect x="618" y="292" width="278" height="60" rx="12" fill="url(#c-card)" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="640" y="316" fill="#86EFAC" font-size="12" font-weight="600">Language &amp; difficulty settings</text>
    <text x="640" y="334" fill="#94A3B8" font-size="11">English, isiXhosa, or both · standard / challenge</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="60" cy="100" r="5" fill="#818CF8"/>
    <text x="72" y="104" fill="#94A3B8" font-size="11">instruction</text>
    <circle cx="160" cy="100" r="5" fill="#34D399"/>
    <text x="172" y="104" fill="#94A3B8" font-size="11">assessment</text>
    <circle cx="270" cy="100" r="5" fill="#FBBF24"/>
    <text x="282" y="104" fill="#94A3B8" font-size="11">motivation loop</text>
  </g>
</svg>
